<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{--navy:#0e2235;--panel:#13293f;--paper:#f2ebd9;--stamp:#ff6a45;--ink:#e4ecf5;--rule:#2c4e73}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  .av{width:1000px;height:1000px;background:var(--navy);
     background-image:linear-gradient(rgba(120,180,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,230,.06) 1px,transparent 1px);
     background-size:50px 50px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif}
  /* red field-tape top */
  .tape{position:absolute;top:0;left:0;right:0;height:64px;
     background:repeating-linear-gradient(45deg,var(--stamp) 0 26px,var(--navy) 26px 52px);opacity:.92}
  .tape.b{top:auto;bottom:0}
  .mark{width:360px;height:360px;border-radius:64px;background:var(--stamp);display:grid;place-items:center;
     box-shadow:0 18px 50px rgba(0,0,0,.4);transform:rotate(-3deg)}
  .mark b{font-size:300px;font-weight:800;color:var(--navy);line-height:1;transform:skewX(-6deg);margin-top:-14px}
  .wm{margin-top:60px;text-align:center}
  .wm .t{font-size:118px;font-weight:800;letter-spacing:-.02em;line-height:.9;color:var(--ink)}
  .wm .t em{font-style:normal;color:var(--stamp)}
  .kick{margin-top:26px;font-family:'Courier Prime',monospace;font-weight:700;font-size:30px;letter-spacing:.34em;color:#8aa4c1;text-transform:uppercase}
</style></head>
<body><div class="av">
  <div class="tape"></div>
  <div class="mark"><b>B</b></div>
  <div class="wm"><div class="t">BOOKED<br><em>JOB</em></div></div>
  <div class="kick">Field&nbsp;Division</div>
  <div class="tape b"></div>
</div></body></html>
