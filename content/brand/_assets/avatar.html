<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{--desk:#d7ccb0;--paper:#f2ebd9;--ink:#211c12;--muted:#655c45;--rule:#c3b894;--stamp:#a62d1a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  .av{width:1000px;height:1000px;background:var(--desk);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif}
  .panel{width:912px;height:912px;background:var(--paper);border:3px solid var(--ink);
     display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:40px}
  .kick{position:absolute;top:40px;left:0;right:0;text-align:center;font-family:'Courier Prime',monospace;font-weight:700;
     font-size:26px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
  .rule{position:absolute;top:92px;left:56px;right:56px;height:2px;background:var(--ink)}
  .wm{text-align:center}
  .wm .t{font-size:188px;font-weight:800;letter-spacing:-.03em;line-height:.82;color:var(--ink)}
  .est{margin-top:36px;font-family:'Courier Prime',monospace;font-weight:700;font-size:24px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  /* stamp-red seal — the brand accent */
  .seal{position:absolute;bottom:58px;right:66px;transform:rotate(-9deg);border:4px solid var(--stamp);color:var(--stamp);
     border-radius:10px;padding:12px 16px 8px;font-family:'Courier Prime',monospace;font-weight:700;text-transform:uppercase;
     text-align:center;line-height:1;box-shadow:inset 0 0 0 2px var(--paper);mix-blend-mode:multiply}
  .seal .a{font-size:20px;letter-spacing:.14em}
  .seal .b{font-size:34px;letter-spacing:.03em;margin-top:5px}
  .mark{position:absolute;bottom:62px;left:66px;font-family:'Courier Prime',monospace;font-weight:700;font-size:150px;color:var(--stamp);line-height:.8}
</style></head>
<body><div class="av"><div class="panel">
  <div class="kick">Booked Job &middot; Field Division</div>
  <div class="rule"></div>
  <div class="wm"><div class="t">BOOKED<br>JOB</div></div>
  <div class="est">Est. for the trades</div>
  <div class="mark">&sect;</div>
  <div class="seal"><div class="a">Field</div><div class="b">REPORT</div></div>
</div></div></body></html>
