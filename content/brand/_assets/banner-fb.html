<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{--navy:#0e2235;--panel:#13293f;--paper:#f2ebd9;--stamp:#ff6a45;--ink:#e4ecf5;--rule:#2c4e73}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1640px;height:624px;overflow:hidden}
  .bn{width:1640px;height:624px;background:var(--navy);
     background-image:linear-gradient(rgba(120,180,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,230,.06) 1px,transparent 1px);
     background-size:50px 50px;position:relative;display:flex;align-items:center;font-family:'Bricolage Grotesque',sans-serif;padding-left:96px}
  .rail{position:absolute;top:0;bottom:0;left:0;width:40px;
     background:repeating-linear-gradient(45deg,var(--stamp) 0 26px,var(--navy) 26px 52px);opacity:.92}
  .kick{font-family:'Courier Prime',monospace;font-weight:700;font-size:24px;letter-spacing:.3em;color:#8aa4c1;text-transform:uppercase;margin-bottom:14px}
  .wm{font-size:150px;font-weight:800;letter-spacing:-.025em;line-height:.86;color:var(--ink)}
  .wm em{font-style:normal;color:var(--stamp)}
  .bar{width:230px;height:9px;background:var(--stamp);margin:22px 0 18px}
  .tag{font-family:'Newsreader',serif;font-size:30px;color:#c4d2e4;max-width:720px;line-height:1.3}
  .tag b{color:var(--ink);font-weight:600}
  /* rotated field-report stamp, right */
  .stamp{position:absolute;right:92px;top:50%;transform:translateY(-50%) rotate(-8deg);
     border:5px solid var(--stamp);color:var(--stamp);border-radius:12px;padding:20px 26px 14px;
     font-family:'Courier Prime',monospace;font-weight:700;text-transform:uppercase;text-align:center;line-height:1;opacity:.95;
     box-shadow:inset 0 0 0 3px var(--navy)}
  .stamp .s1{font-size:30px;letter-spacing:.18em}
  .stamp .s2{font-size:58px;letter-spacing:.04em;margin-top:8px}
  .stamp .s3{font-size:18px;letter-spacing:.22em;margin-top:10px;color:#8aa4c1}
</style></head>
<body><div class="bn">
  <div class="rail"></div>
  <div>
    <div class="kick">Booked Job &middot; Field Reports</div>
    <div class="wm">BOOKED <em>JOB</em></div>
    <div class="bar"></div>
    <div class="tag">The truth about every tool, app &amp; lead service <b>sold to contractors.</b></div>
  </div>
  <div class="stamp"><div class="s1">Field</div><div class="s2">REPORT</div><div class="s3">Filed · Honest</div></div>
</div></body></html>
