<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{--navy:#0e2235;--stamp:#ff6a45;--ink:#e4ecf5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  .yt{width:2560px;height:1440px;background:var(--navy);
     background-image:linear-gradient(rgba(120,180,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,230,.06) 1px,transparent 1px);
     background-size:56px 56px;position:relative;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif}
  .tape{position:absolute;left:0;right:0;height:60px;background:repeating-linear-gradient(45deg,var(--stamp) 0 28px,var(--navy) 28px 56px);opacity:.9}
  .tape.t{top:0}.tape.b{bottom:0}
  /* content constrained to the 1546x423 TV-safe zone */
  .safe{width:1546px;display:flex;align-items:center;justify-content:space-between;gap:60px}
  .kick{font-family:'Courier Prime',monospace;font-weight:700;font-size:26px;letter-spacing:.3em;color:#8aa4c1;text-transform:uppercase;margin-bottom:12px}
  .wm{font-size:150px;font-weight:800;letter-spacing:-.025em;line-height:.86;color:var(--ink)}
  .wm em{font-style:normal;color:var(--stamp)}
  .bar{width:220px;height:9px;background:var(--stamp);margin:20px 0 16px}
  .tag{font-family:'Newsreader',serif;font-size:29px;color:#c4d2e4;max-width:620px;line-height:1.3}
  .tag b{color:var(--ink);font-weight:600}
  .stamp{flex:none;transform:rotate(-8deg);border:5px solid var(--stamp);color:var(--stamp);border-radius:12px;
     padding:22px 30px 16px;font-family:'Courier Prime',monospace;font-weight:700;text-transform:uppercase;text-align:center;line-height:1;box-shadow:inset 0 0 0 3px var(--navy)}
  .stamp .s1{font-size:32px;letter-spacing:.18em}
  .stamp .s2{font-size:64px;letter-spacing:.04em;margin-top:8px}
  .stamp .s3{font-size:19px;letter-spacing:.22em;margin-top:10px;color:#8aa4c1}
</style></head>
<body><div class="yt">
  <div class="tape t"></div>
  <div class="safe">
    <div>
      <div class="kick">Booked Job &middot; Field Reports</div>
      <div class="wm">BOOKED <em>JOB</em></div>
      <div class="bar"></div>
      <div class="tag">The truth about every tool, app &amp; lead service <b>sold to contractors.</b></div>
    </div>
    <div class="stamp"><div class="s1">Field</div><div class="s2">REPORT</div><div class="s3">Filed · Honest</div></div>
  </div>
  <div class="tape b"></div>
</div></body></html>
