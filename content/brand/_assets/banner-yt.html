<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{--desk:#d7ccb0;--paper:#f2ebd9;--ink:#211c12;--muted:#655c45;--rule:#c3b894;--stamp:#a62d1a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  .yt{width:2560px;height:1440px;background:var(--desk);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif}
  /* content lives in the ~1546x423 TV-safe zone, framed like the site masthead */
  .panel{width:1546px;background:var(--paper);border:3px solid var(--ink);position:relative;
     display:flex;align-items:center;padding:56px 72px;gap:48px}
  .kick{font-family:'Courier Prime',monospace;font-weight:700;font-size:24px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
  .wm{font-size:148px;font-weight:800;letter-spacing:-.03em;line-height:.82;color:var(--ink)}
  .bar{width:220px;height:9px;background:var(--stamp);margin:22px 0 18px}
  .tag{font-family:'Newsreader',serif;font-size:30px;color:var(--ink);max-width:680px;line-height:1.28}
  .tag em{font-style:italic}
  .tag b{font-weight:600}
  .seal{flex:none;margin-left:auto;transform:rotate(-8deg);border:5px solid var(--stamp);color:var(--stamp);border-radius:12px;
     padding:20px 28px 14px;font-family:'Courier Prime',monospace;font-weight:700;text-transform:uppercase;text-align:center;line-height:1;
     box-shadow:inset 0 0 0 3px var(--paper);mix-blend-mode:multiply}
  .seal .s1{font-size:30px;letter-spacing:.16em}
  .seal .s2{font-size:60px;letter-spacing:.03em;margin-top:8px}
  .seal .s3{font-size:18px;letter-spacing:.2em;margin-top:10px;color:var(--muted)}
</style></head>
<body><div class="yt"><div class="panel">
  <div>
    <div class="kick">Booked Job &middot; Field Division</div>
    <div class="wm">BOOKED JOB</div>
    <div class="bar"></div>
    <div class="tag">The truth about every tool, app &amp; lead service <em>sold to you.</em></div>
  </div>
  <div class="seal"><div class="s1">Field</div><div class="s2">REPORT</div><div class="s3">Filed · Honest</div></div>
</div></div></body></html>
